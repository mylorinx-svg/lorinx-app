<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LORINX">
<title>LORINX מרכז שליטה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&display=swap">
<style>
/* ReStructure-style operating console: dark module sidebar with badges, lime approve buttons, hero morning card, hub-and-spoke orchestrator, dark agent terminal. */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --ink:#111111; --muted:#6B6B66; --line:#E3E3DD; --line2:#EEEEE9;
  --side:#0B0B0B; --sidefg:#F2F2EE; --sidemut:#8B8B85; --sideact:#1C1C1A;
  --lime:#C8102E; --limeink:#FFFFFF; --hot:#C8102E;
  --ok:#111111; --warn:#6B6B66; --bad:#C8102E; --off:#777777;
  --okbg:#EAEAEA; --warnbg:#F0F0F0; --badbg:#F9DADD; --offbg:#EAEAE6;
  --font:'Arimo','Arial',sans-serif; --mono:ui-monospace,Menlo,Consolas,monospace; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0C0B; --surface:#171716; --ink:#F2F2EE; --muted:#A5A5A0; --line:#2B2B29; --line2:#222220;
  --side:#050505; --sideact:#1A1A18; --ok:#F2F2EE; --warn:#A5A5A0; --bad:#FF5A6A;
  --okbg:#242422; --warnbg:#1F1F1E; --badbg:#3A1519; --offbg:#242422; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0B; --surface:#171716; --ink:#F2F2EE; --muted:#A5A5A0; --line:#2B2B29; --line2:#222220;
  --side:#050505; --sideact:#1A1A18; --ok:#F2F2EE; --warn:#A5A5A0; --bad:#FF5A6A;
  --okbg:#242422; --warnbg:#1F1F1E; --badbg:#3A1519; --offbg:#242422; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;font-size:15px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--sidefg);padding:20px 12px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 10px 6px;display:flex;align-items:center;gap:10px}
.brand i{width:30px;height:30px;background:var(--lime);border-radius:8px;display:grid;place-items:center;color:var(--limeink);font-style:normal;font-weight:700;font-size:16px}
.brand b{display:block;font-size:17px;letter-spacing:.14em;line-height:1.1}
.brand span{font-size:11px;color:var(--sidemut)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h4{margin:14px 10px 6px;font-size:10.5px;letter-spacing:.14em;color:var(--sidemut);font-weight:700}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;color:var(--sidefg);text-decoration:none;font-size:14px;border-radius:9px;cursor:pointer;position:relative}
.nav a:hover{background:var(--sideact)}
.nav a.on{background:var(--sideact);font-weight:700}
.nav a.on::before{content:"";position:absolute;inset-inline-end:-12px;top:9px;bottom:9px;width:3px;background:var(--lime);border-radius:3px}
.nav a:focus-visible{outline:2px solid var(--lime);outline-offset:-2px}
.nav .lab{display:flex;align-items:center;gap:9px;min-width:0}
.nav .ic{width:8px;height:8px;border-radius:50%;background:#555;flex:none}
.nav .ic.ok{background:#F2F2EE}.nav .ic.warn{background:#8B8B85}.nav .ic.bad{background:var(--hot)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.badge.dim{background:#2B2B29;color:#cfcfc8}
.connside{padding:6px 10px}
.connside h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.14em;color:var(--sidemut);font-weight:700}
.chipsd{display:flex;flex-wrap:wrap;gap:6px}
.chipsd span{font-size:11px;padding:3px 8px;border-radius:7px;background:#1A1A18;color:#d8d8d2;display:inline-flex;gap:6px;align-items:center}
.chipsd span i{width:6px;height:6px;border-radius:50%;background:#555}
.chipsd span i.ok{background:#111}.chipsd span i.bad{background:var(--hot)}
.sidefoot{margin-top:auto;font-size:12px;color:var(--sidemut);padding:10px;border:1px solid #232321;border-radius:12px;display:flex;gap:10px;align-items:center}
.sidefoot .av{display:flex}
.sidefoot .av span{width:22px;height:22px;border-radius:50%;border:2px solid var(--side);margin-inline-start:-6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#111}
.sidefoot .av span:nth-child(1){background:var(--lime);margin-inline-start:0}.sidefoot .av span:nth-child(2){background:#8B8B85}.sidefoot .av span:nth-child(3){background:#E3E3DD}
.sidefoot b{display:block;color:#eee;font-size:12px}
.main{min-width:0;padding:20px 28px 60px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pillx{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:6px 12px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.pillx i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(200,16,46,.35)}
.pillx.bad i{background:var(--hot);box-shadow:0 0 0 3px rgba(200,16,46,.25)}
.clock{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--muted)}
h2{font-size:11.5px;letter-spacing:.1em;margin:0 0 12px;font-weight:700;color:var(--muted)}
.ticker{background:#0B0B0B;color:#d8d8d2;border-radius:10px;padding:9px 14px;display:flex;gap:26px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;white-space:nowrap;direction:ltr}
.ticker b{color:#fff;margin-inline-end:6px}.ticker .up{color:#FFFFFF}.ticker .dn{color:#FF5A6A}
.hero{border-radius:var(--r);padding:20px 22px;background:linear-gradient(135deg,#111,#2a2a2a);color:#fff;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:center}
.hero .big{font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.hero .hi{font-size:14px;margin-top:6px}
.hero .ov{text-align:end}.hero .ov b{display:block;font-size:44px;line-height:1}.hero .ov span{font-size:12px;letter-spacing:.05em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{color:var(--muted);font-size:12px}
.kpi.warn b{color:var(--warn)} .kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card>h2{margin-bottom:14px}
.card.dark{background:#0B0B0B;border-color:#0B0B0B;color:#e8e8e2}.card.dark h2{color:#8b8b85}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
.pill{display:inline-block;font-size:12px;padding:2px 10px;font-weight:700;white-space:nowrap;border-radius:20px}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)} .pill.off{background:var(--offbg);color:var(--off)} .pill.lime{background:var(--lime);color:var(--limeink)}
button{font:inherit;cursor:pointer;padding:7px 15px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:9px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.go{background:var(--lime);border-color:var(--lime);color:var(--limeink);font-weight:700}
button.sm{padding:4px 11px;font-size:13px}
button.x{padding:2px 8px;font-size:13px;background:transparent;color:var(--muted);border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,.node:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0;width:100%}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.err{font-size:13px;color:var(--bad);margin:0}
.stale{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:start;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:end}
tr.hot td{background:var(--badbg)}
.prog{height:8px;background:var(--line2);border-radius:6px;margin-top:8px;position:relative;overflow:hidden}
.prog i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--ink);border-radius:6px;transition:width .4s}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding-block:9px;border-top:1px solid var(--line2);align-items:center}
.row:first-child{border-top:0;padding-top:0}
.row .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .v{color:var(--muted);font-size:13px;text-align:end}
.row .d{color:var(--muted);font-size:13px;grid-column:1 / -1;overflow-wrap:anywhere}
.erow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;padding-block:8px;border-top:1px solid var(--line2);align-items:center}
.erow:first-child{border-top:0;padding-top:0}
.erow .full{grid-column:1 / -1}
.stack{display:flex;flex-direction:column;gap:6px}
.todo{display:flex;gap:10px;align-items:flex-start;padding-block:9px;border-top:1px solid var(--line2)}
.todo:first-child{border-top:0;padding-top:0}
.todo input[type=checkbox]{margin-top:3px;flex:none}
.todo.done span{text-decoration:line-through;color:var(--muted)}
.todo label{display:flex;gap:10px;flex:1;cursor:pointer;min-width:0}
.clip{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 16px;padding-block:14px;border-top:1px solid var(--line2);align-items:start}
.clip:first-child{border-top:0;padding-top:0}
.clip .cv{width:120px;aspect-ratio:9/16;background:#000;border-radius:10px;display:block;object-fit:cover}
.clip .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.clip .tp{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.clip .cap{white-space:pre-line;line-height:1.6;font-size:14px}
.clip h3{margin:0;font-size:17px}
.clip.edit{display:flex;flex-direction:column}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.file{font-family:var(--mono);font-size:12px;direction:ltr;text-align:left;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 10px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.editing .card,.editing .kpi{outline:1px dashed var(--line)}
.conn{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line2)}
.conn:first-child{border-top:0;padding-top:0}
.conn .d{grid-column:1 / -1;color:var(--muted);font-size:13px}
.setgrid{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:6px 12px;align-items:center}
.setgrid .k{font-size:14px;min-width:0}
.setgrid .k small{display:block;color:var(--muted);font-size:12px}
#hub svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node circle.c{fill:var(--surface);stroke:var(--lime);stroke-width:4}
.node:hover circle.c,.node:focus-visible circle.c{stroke-width:7}
.node text{fill:var(--ink);font-family:var(--font)}
.node .sub{fill:var(--muted)}
.orch circle.o{fill:#0B0B0B;stroke:var(--lime);stroke-width:6}
.orch text{fill:#fff;font-family:var(--font)}
.link{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:5 6}
.bdgc{fill:var(--hot)} .bdgt{fill:#fff !important;font-weight:700}
.term{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:7px;direction:rtl}
.term div{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px}
.term b{color:var(--lime)}.term .t{color:#8b8b85}
.sec{padding-block:10px;border-top:1px solid var(--line2)}.sec:first-of-type{border-top:0;padding-top:0}
.sec h3{margin:0 0 8px;font-size:13px}
.line{display:flex;justify-content:space-between;gap:10px;padding-block:5px;font-size:14px;align-items:center}
.line span:last-child{font-variant-numeric:tabular-nums}
.netbar{background:#0B0B0B;color:#fff;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-block:10px}
.netbar b{font-size:30px;color:var(--lime);font-variant-numeric:tabular-nums}
.next{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-block:8px;border-top:1px solid var(--line2);font-size:14px}
.next:first-of-type{border-top:0}
.next .n{width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--limeink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.next>span:first-child{display:flex;gap:10px;align-items:center;min-width:0}
#msg{position:fixed;inset-inline:16px;bottom:14px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:520px;margin-inline:auto}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;gap:8px;padding:14px 12px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav h4,.connside,.sidefoot{display:none}
  .nav a{white-space:nowrap}
  .nav a.on::before{display:none}.nav a.on{box-shadow:inset 0 -3px 0 var(--lime)}
  .main{padding:14px 14px 48px}
  .clip{grid-template-columns:96px minmax(0,1fr)}.clip .cv{width:96px}
  .hero .big{font-size:40px}.hero .ov b{font-size:34px}
  .term div{grid-template-columns:84px minmax(0,1fr)}.term .t{display:none}
}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal .day{min-height:104px;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface);min-width:0}
.cal .day.out{opacity:.45}.cal .day.off{background:var(--offbg)}.cal .day.today{border:2px solid var(--ink)}
.cal .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.cal .ev{font:inherit;font-size:11px;text-align:start;border-radius:6px;padding:4px 5px;border:0;cursor:pointer;line-height:1.25;overflow-wrap:anywhere;width:100%}
.cal .ev b{display:block;font-size:11px}
.ev.ok{background:var(--okbg);color:var(--ok)}.ev.warn{background:var(--warnbg);color:var(--warn)}.ev.off{background:var(--offbg);color:var(--off)}.ev.lime{background:var(--lime);color:var(--limeink)}.ev.sel{outline:2px solid var(--ink)}
.exrow{display:grid;grid-template-columns:minmax(0,2fr) 100px 100px minmax(0,2fr) auto;gap:6px;padding-block:6px;border-top:1px solid var(--line2);align-items:center}
.exrow.h{font-size:12px;color:var(--muted);border-top:0}
.upc{display:grid;grid-template-columns:96px 52px minmax(0,1fr) auto;gap:8px;padding-block:8px;border-top:1px solid var(--line2);align-items:center;font-size:14px}
.upc:first-child{border-top:0}
@media (max-width:720px){.cal .day{min-height:70px;padding:4px}.cal .ev{font-size:10px;padding:3px}.exrow{grid-template-columns:1fr 1fr}.upc{grid-template-columns:80px 44px minmax(0,1fr)}.upc .pill{grid-column:1/-1;justify-self:start}}
@media (max-width:560px){.cal{gap:4px}.cal .day{min-height:56px;padding:4px}.cal .dn span:nth-child(2){display:none}.cal .ev{font-size:0;padding:0;height:16px;min-height:16px;border-radius:5px}.cal .ev b{display:none}}
</style>

<div class="app" dir="rtl" lang="he" id="app">
  <aside class="side">
    <div class="brand"><i>L</i><div><b>LORINX</b><span>מערכת הפעלה לעסק</span></div></div>
    <nav class="nav" id="nav" aria-label="ניווט"></nav>
    <div class="connside" id="connside"></div>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>
  <div class="main">
    <div class="top">
      <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
      <div class="tools">
        <span class="pillx" id="livepill"><i></i><span id="livetxt"></span></span>
        <span class="clock" id="clock" dir="ltr"></span>
        <button id="refbtn" class="ghost sm">רענן נתונים</button>
        <button id="editbtn" class="ghost sm" hidden>עריכה</button>
      </div>
    </div>
    <main id="view"></main>
  </div>
</div>
<div id="msg" hidden></div>

<script src="gate.js"></script>
<script src="shim.js"></script>

        var cur=v[r-1]?v[r-1][1]:"";var k=el("div","k",label);g.appendChild(k);
        var i=document.createElement("input");i.type="text";i.inputMode="decimal";i.value=pendingSheet[r]!=null?pendingSheet[r]:(cur==null?"":cur);i.id="sheet-"+r;i.dir="ltr";
        i.addEventListener("input",function(){pendingSheet[r]=i.value;sv.disabled=false});g.appendChild(i);
      }
      SET_ROWS.forEach(function(x){field(x[0],x[1])});
      g.appendChild(el("div","k","הוצאות חודשיות: ניהול בעמוד \"הוצאות\""));g.appendChild(el("span"));
      pb.appendChild(g);
      var sv=el("button",null,"שמור לגיליון");sv.disabled=true;
      sv.addEventListener("click",function(){saveSheet(sv)});
      var bar=el("div","bar");bar.appendChild(sv);pb.appendChild(bar);
      pb.appendChild(el("p","note","השמירה כותבת ישירות לגיליון LORINX Brain (לשונית settings) והסוכנים קוראים משם. סך ההוצאות הקבועות מחושב מחדש אוטומטית."));
      pb.appendChild(stamp("sheet"));
    }
    /* local business params */
    var lb=el("div"),lg=el("div","setgrid");
    lg.appendChild(el("div","k","רווח ממוצע להזמנה (₪)"));
    var ni=document.createElement("input");ni.type="text";ni.inputMode="decimal";ni.dir="ltr";ni.value=String(M.biz.netPerOrder||296);ni.id="set-net";
    ni.addEventListener("change",function(){var n=parseFloat(ni.value);if(!isNaN(n)&&n>0){M.biz.netPerOrder=n;saveBiz();render()}else{msg("ערך לא תקין")}});
    if(!canWrite)ni.disabled=true;lg.appendChild(ni);lb.appendChild(lg);
    lb.appendChild(el("p","note","גיבוי בלבד: משמש רק להזמנה שמחירה לא תואם מוצר בגיליון. כל הזמנה אחרת מחושבת לפי המחיר והעלות שלה."));
    f.appendChild(card("חיבורים",cb));
    f.appendChild(card("פרמטרים עסקיים (מהגיליון)",pb));
    f.appendChild(card("הנחות חישוב",lb));
    var wrap=el("div","grid2");while(f.firstChild)wrap.appendChild(f.firstChild);
    var out=document.createDocumentFragment();out.appendChild(wrap);
    /* theme / access info */
    return out;
  }
  function saveSheet(btn){
    if(!mcp){msg("השמירה לגיליון זמינה רק מתוך claude.ai");return}
    var v=sheetVals();if(!v)return;
    var writes=[];
    Object.keys(pendingSheet).forEach(function(r){var raw=String(pendingSheet[r]).replace(/,/g,"").trim();var n=parseFloat(raw);if(isNaN(n)){return}writes.push([Number(r),n])});
    if(!writes.length){msg("אין שינויים תקינים לשמירה");return}
    var exp={};EXP_ROWS.forEach(function(r){exp[r]=num(v[r-1]&&v[r-1][1])||0});
    writes.forEach(function(w){if(exp[w[0]]!=null&&EXP_ROWS.indexOf(w[0])>=0)exp[w[0]]=w[1]});
    var tot=EXP_ROWS.reduce(function(s,r){return s+exp[r]},0);tot=Math.round(tot*100)/100;
    var noTemp=Math.round((tot-exp[24])*100)/100;
    var anyExp=writes.some(function(w){return EXP_ROWS.indexOf(w[0])>=0});
    if(anyExp){writes.push([25,tot]);writes.push([26,noTemp]);writes.push([14,tot])}
    btn.disabled=true;btn.textContent="שומר…";
    var chain=Promise.resolve();
    writes.forEach(function(w){chain=chain.then(function(){return mcp.callTool("Google Sheets","update_values",{spreadsheetId:SHEET,range:"settings!B"+w[0],values:[[w[1]]]},{cache:false})})});
    chain.then(function(){pendingSheet={};msg("נשמר בגיליון");btn.textContent="שמור לגיליון";return loadSheet()}).then(render,function(e){btn.disabled=false;btn.textContent="שמור לגיליון";msg(errText(e,"Google Sheets"))});
  }

  /* ---------- shell ---------- */
  function connState(n){var cs=LIVE.conn;if(!cs||!cs.data)return "";var k=n.toLowerCase().replace(/[\s_]/g,"");var m=cs.data.filter(function(x){return String(x.server).toLowerCase().replace(/[\s_]/g,"")===k})[0];return m?(m.authStatus==="connected"?"ok":"bad"):"bad"}
  function attention(){var c=calc();return pendingClips()+(c.late||0)}
  function renderNav(){
    var nav=document.getElementById("nav");nav.textContent="";
    function link(id,label,ic,bn,bcls){
      var a=el("a",view===id?"on":null);a.tabIndex=0;a.setAttribute("role","link");
      var l=el("span","lab");if(ic!==undefined)l.appendChild(el("span","ic "+(ic||"")));l.appendChild(el("span",null,label));a.appendChild(l);
      if(bn)a.appendChild(el("span","badge"+(bcls==="dim"?" dim":""),String(bn)));
      a.addEventListener("click",function(){go(id)});a.addEventListener("keydown",function(e){if(e.key==="Enter"){go(id)}});return a;
    }
    nav.appendChild(el("h4",null,"בעלים"));
    nav.appendChild(link("overview","Command Center",undefined,attention()));
    nav.appendChild(link("cal","לוח פרסומים",undefined,0));
    nav.appendChild(el("h4",null,"מודולים"));
    M.depts.forEach(function(d){var b=deptBadge(d);nav.appendChild(link(d.id,d.name,b?(b.cls==="bad"?"bad":"warn"):(d.st==="warn"?"warn":(d.st==="off"?"":"ok")),b?b.n:0))});
    nav.appendChild(el("h4",null,"מערכת"));
    nav.appendChild(link("expenses","הוצאות",undefined,0));
    nav.appendChild(link("settings","הגדרות",undefined,0));
    var cs=document.getElementById("connside");cs.textContent="";cs.appendChild(el("h4",null,"מחובר"));
    var ch=el("div","chipsd");
    [["Shopify","Shopify"],["Sheets","Google Sheets"],["Gmail","Gmail"]].forEach(function(x){var st=connState(x[1]),sp=el("span");sp.appendChild(el("i",st));sp.appendChild(document.createTextNode(x[0]));ch.appendChild(sp)});
    ["Metricool","ManyChat","Omnisend","Canva"].forEach(function(x){var sp=el("span");sp.appendChild(el("i"));sp.appendChild(document.createTextNode(x));ch.appendChild(sp)});
    cs.appendChild(ch);
  }
  function syncChrome(){
    var eb=document.getElementById("editbtn");eb.hidden=!(db&&canWrite)||view==="settings"||view==="cal"||view==="expenses";eb.textContent=editMode?"סיום עריכה":"עריכה";
    document.getElementById("app").classList.toggle("editing",editMode&&canWrite);
    var f=document.getElementById("sidefoot");f.textContent="";
    var av=el("div","av");["L","C","O"].forEach(function(x){av.appendChild(el("span",null,x))});f.appendChild(av);
    var n=M.depts.reduce(function(s,d){return s+d.agents.length},0),t=el("div");t.appendChild(el("b",null,n+" סוכנים מתוזמנים"));t.appendChild(document.createTextNode(db?(canWrite?"נשמר אוטומטית":"תצוגה בלבד"):"תצוגה בלבד"));f.appendChild(t);
    var p=pendingClips(),c=calc(),lp=document.getElementById("livepill"),bad=(c.late>0);
    lp.className="pillx"+(bad?" bad":"");document.getElementById("livetxt").textContent=bad?(c.late+" הזמנות באיחור"):(p?(p+" ממתינים לאישור"):"הכול מעודכן");
  }
  function titleFor(){
    if(view==="overview")return ["Command Center","מנהל-על: מה נמכר, מה זה עלה, מה לעשות"];
    if(view==="settings")return ["הגדרות","חיבורים ופרמטרים"];
    if(view==="cal")return ["לוח פרסומים","מה עולה ומתי, מה כבר פורסם"];
    if(view==="expenses")return ["הוצאות","הוספה, עריכה ומחיקה של הוצאות חודשיות"];
    var d=dept(view);return [d?d.name:"","מודול"];
  }
  var scrollKeep=null;
  function render(){
    if(view==="map")view="overview";
    var t=titleFor();document.getElementById("title").textContent=t[0];document.getElementById("subtitle").textContent=t[1];
    renderNav();syncChrome();
    var v=document.getElementById("view");v.textContent="";
    var d=dept(view);
    if(view==="overview")v.appendChild(overviewView());
    
    else if(view==="settings")v.appendChild(settingsView());
    else if(view==="cal")v.appendChild(calendarView());
    else if(view==="expenses")v.appendChild(expensesView());
    else if(d)v.appendChild(deptView(d));
    else{view="overview";render()}
  }
  function go(id){
    view=id;try{location.hash=id}catch(e){}
    render();window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",function(){var h=(location.hash||"").replace("#","");if(h&&h!==view&&(["overview","settings","cal","expenses"].indexOf(h)>=0||dept(h))){view=h;render()}});
  document.getElementById("refbtn").addEventListener("click",refreshAll);
  document.getElementById("editbtn").addEventListener("click",function(){editMode=!editMode;render()});
  var ck=document.getElementById("clock");
  function tick(){var ht=document.getElementById("herotime");if(ht)ht.textContent=nowHM();try{ck.textContent=new Date().toLocaleTimeString("he-IL",{timeZone:"Asia/Jerusalem",hour:"2-digit",minute:"2-digit",hour12:false})}catch(e){}}
  tick();setInterval(tick,30000);
  var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(view==="overview")render()},150)});

  /* ---------- store ---------- */
  function seed(){
    if(seeded||!canWrite)return;seeded=true;
    D_DEPTS.forEach(function(d){saveDept(clone(d))});D_TODOS.forEach(function(t){saveTodo(clone(t))});
  }
  function start(dbi){
    db=dbi;
    var ready=(window.claude&&window.claude.use)?window.claude.use("user"):Promise.resolve(null);
    function afterPerm(){syncChrome();render();if(storeEmpty)seed()}
    ready.then(function(us){var c=null;try{c=(us&&us.can)?us.can("data.write"):null}catch(e){}
      Promise.resolve(c).then(function(x){canWrite=(x!==false);afterPerm()},function(){canWrite=true;afterPerm()})},function(){canWrite=true;afterPerm()});
    db.collection("depts").onSnapshot(function(s){
      if(s.empty){storeEmpty=true;if(canWrite)seed();return}
      storeEmpty=false;seeded=true;
      var arr=s.docs.map(function(x){var v=clone(x.data());v.id=x.id;v.stats=v.stats||[];v.agents=v.agents||[];v.sections=v.sections||[];v.tools=v.tools||[];return v}).sort(function(a,b){return (a.order||0)-(b.order||0)});
      try{if(!localStorage.getItem("lx_ads_v1")&&!arr.some(function(x){return x.id==="ads"})){var ad=clone(D_DEPTS.filter(function(x){return x.id==="ads"})[0]);arr.push(ad);localStorage.setItem("lx_ads_v1","1");if(canWrite)saveDept(clone(ad))}}catch(e){}
      if(J(arr)===J(M.depts))return;M.depts=arr;render();
    },function(){});
    db.doc("cfg/biz").onSnapshot(function(s){if(!s.exists)return;var v=s.data();if(J(v)===J(M.biz))return;M.biz=clone(v);render()},function(){});
    db.collection("todos").onSnapshot(function(s){
      if(s.empty&&!seeded)return;
      var arr=s.docs.map(function(x){var v=x.data();var tx=v.text||x.id;if(/החיוב הבא ב-30\.9/.test(tx))tx="לוודא שאמצעי התשלום ב-Shopify עודכן (החיוב ב-30.9 כבר עבר)";return {id:x.id,text:tx,dept:v.dept||"",done:!!v.done}});
      if(J(arr)===J(M.todos))return;M.todos=arr;render();
    },function(){});
    db.collection("clips").orderBy("date").onSnapshot(function(s){
      var arr=s.docs.map(function(x){var v=clone(x.data());v.id=x.id;return v});
      if(J(arr)===J(M.clips))return;M.clips=arr;render();
    },function(){});
  }
  var h0=(location.hash||"").replace("#","");if(h0)view=h0;
  syncChrome();render();
  function boot(){
    var c=window.claude;
    if(!c||!c.use){render();return}
    c.use("db").then(function(d){if(d)start(d)},function(){});
    c.use("mcp").then(function(m){mcp=m;if(m){refreshAll()}else{loadConn();render()}},function(){mcp=null;render()});
  }
  boot();
  /* auto refresh: every 3 minutes and when the window regains focus, never while typing */
  function autoRef(){var a=document.activeElement;if(document.hidden||!mcp||loading)return;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;refreshAll()}
  setInterval(autoRef,180000);window.addEventListener("focus",function(){setTimeout(autoRef,400)});
  setInterval(function(){if(mcp&&!document.hidden)refreshAll()},300000);
})();
</script>

<style>
/* Layout: one reading column of change records; each record = screenshot evidence, then a current/proposed table, then the reason. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#14181F; --muted:#5B6573; --line:#D9DEE5;
  --accent:#0B5E7A; --accent-soft:#E3F0F5;
  --cur:#F7F3EE; --new:#EAF4EE; --new-ink:#0F4A2C;
  --ph:#8A4B00; --ph-bg:#FFF1D6;
  --crit:#A3162B; --high:#9A4A00; --med:#3C5A80; --low:#5B6573;
  --shot:#0B0B0C;
  --f-text:"Heebo","Arial Hebrew","Noto Sans Hebrew",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1318; --surface:#171C23; --ink:#E8ECF1; --muted:#9AA5B4; --line:#2B333E;
  --accent:#6CC4E0; --accent-soft:#12303B;
  --cur:#231F1A; --new:#14261C; --new-ink:#A6E3BF;
  --ph:#FFC56B; --ph-bg:#3A2A0C;
  --crit:#FF8D9B; --high:#FFB56B; --med:#9DB8DC; --low:#9AA5B4;
  --shot:#000; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1318; --surface:#171C23; --ink:#E8ECF1; --muted:#9AA5B4; --line:#2B333E;
  --accent:#6CC4E0; --accent-soft:#12303B;
  --cur:#231F1A; --new:#14261C; --new-ink:#A6E3BF;
  --ph:#FFC56B; --ph-bg:#3A2A0C;
  --crit:#FF8D9B; --high:#FFB56B; --med:#9DB8DC; --low:#9AA5B4;
  --shot:#000; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:16px;line-height:1.6}
.wrap{max-width:1020px;margin-inline:auto;padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:44px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(34px,6vw,54px);font-weight:300;letter-spacing:-.01em}
h2{font-size:26px;font-weight:500}
h3{font-size:18px;font-weight:500}
p{margin:0}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line);padding-bottom:28px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent)}
.lede{max-width:62ch;color:var(--muted);font-size:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;margin:10px 0 0;background:var(--line);border:1px solid var(--line)}
.facts div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}

.how,.toc{display:flex;flex-direction:column;gap:12px}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.legend li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:start;font-size:15px}
.note{font-size:14px;color:var(--muted);max-width:75ch}
.toc ol{margin:0;padding-inline-start:20px;display:grid;gap:4px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.toc .n{color:var(--muted);font-size:13px}

.page{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px}
.page>h2{padding-top:18px;border-top:2px solid var(--ink)}
.intro{color:var(--muted);max-width:70ch}

.item{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px;padding:20px;scroll-margin-top:16px;min-width:0}
.item>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
.item>header h3{flex:1 1 220px;min-width:0}
.id{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:2px 7px;text-decoration:none}
.pr{font-size:12.5px;font-weight:500;white-space:nowrap}
.pr-c{color:var(--crit)} .pr-h{color:var(--high)} .pr-m{color:var(--med)} .pr-l{color:var(--low)}

.shot{margin:0;display:flex;flex-direction:column;gap:6px}
.shot .frame{background:var(--shot);border:1px solid var(--line);max-height:560px;overflow:auto}
.shot img{display:block;width:100%;height:auto}
.shot.narrow .frame{max-width:400px}
.shot figcaption{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);direction:ltr;text-align:right}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:right;vertical-align:top}
thead th{font-size:12.5px;font-weight:500;color:var(--muted);background:var(--bg)}
tbody th{font-weight:500;width:15%;min-width:104px;font-size:14px}
td.cur{background:var(--cur);width:36%;min-width:200px}
td.new{background:var(--new);color:var(--new-ink);width:36%;min-width:200px;font-weight:500}
td.new.same{background:transparent;color:var(--muted);font-weight:400}
td.st{width:13%;min-width:104px}
.k{display:inline-block;font-size:12px;font-weight:500;padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.k-replace{color:var(--accent)} .k-add{color:var(--new-ink)} .k-keep{color:var(--muted)} .k-data{color:var(--ph)} .k-approve{color:var(--crit)} .k-remove{color:var(--high)}
.ph{background:var(--ph-bg);color:var(--ph);padding:0 3px;font-weight:500}

.why{max-width:78ch;font-size:15px}
.why b,.before b{font-size:12.5px;font-weight:700;color:var(--muted);margin-inline-end:6px}
.before{border-inline-start:3px solid var(--ph);padding-inline-start:12px;font-size:15px;display:flex;flex-direction:column;gap:4px}
.before ul,.plain{margin:0;padding-inline-start:20px;display:grid;gap:5px}
.plain{max-width:80ch}
.need{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.need>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.idx td,.idx th{font-size:14px}
.idx td:nth-child(n+4){text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.idx tbody td:nth-child(2){min-width:200px}

@media (max-width:640px){
  .item{padding:14px}
  .legend li{grid-template-columns:1fr;gap:4px}
  table:not(.idx) thead{display:none}
  table:not(.idx), table:not(.idx) tbody, table:not(.idx) tr, table:not(.idx) th, table:not(.idx) td{display:block;width:auto;min-width:0}
  table:not(.idx) tr{border:1px solid var(--line);margin-bottom:10px}
  table:not(.idx) th, table:not(.idx) td{border:0;border-bottom:1px solid var(--line)}
  table:not(.idx) td.cur::before{content:"קיים היום";display:block;font-size:11.5px;color:var(--muted);font-weight:400}
  table:not(.idx) td.new::before{content:"מוצע";display:block;font-size:11.5px;color:var(--muted);font-weight:400}
  table:not(.idx) td.st{border-bottom:0}
}
</style>
<style>
/* review layer */
.steps{margin:0;padding-inline-start:22px;display:grid;gap:6px;max-width:78ch}
textarea,input[type=text]{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 10px;width:100%;box-sizing:border-box;resize:vertical;min-width:0}
textarea:focus-visible,input[type=text]:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.warnbox{background:var(--ph-bg);color:var(--ph);padding:8px 12px;font-size:14px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip,.btn{font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:4px 10px;cursor:pointer;min-height:30px}
.chip:hover,.btn:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip.on-no{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.chip.main,.btn.main{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.on{background:var(--new);border-color:var(--new-ink);color:var(--new-ink)}
.edbox,.ntbox,.addbox{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.edbox[hidden],.ntbox[hidden],.addbox[hidden]{display:none}
.edrow{display:flex;flex-wrap:wrap;gap:6px}
td.new.edited{box-shadow:inset 3px 0 0 var(--accent)}
.was{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:6px}
tr.dec-ok th{box-shadow:inset -3px 0 0 var(--new-ink)}
tr.dec-no th{box-shadow:inset -3px 0 0 var(--crit)}
tr.dec-no td.new .val{text-decoration:line-through;opacity:.55}
.itemtools{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.bulk{display:flex;flex-wrap:wrap;gap:6px}
.addedlist{display:grid;gap:8px}
.added{border:1px solid var(--new-ink);background:var(--new);color:var(--new-ink);padding:8px 10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.addh{display:flex;gap:8px;align-items:center;font-size:14px}
.bar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--ink);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));font-size:14px}
.bar #lx-count{font-variant-numeric:tabular-nums;flex:1 1 260px;min-width:0}
.bar #lx-save{color:var(--muted);font-size:13px}
.bar #lx-save.bad{color:var(--crit)}
.bar #lx-ready-note{color:var(--new-ink);font-size:13px}
.bar [hidden]{display:none}
@media (max-width:640px){
  table:not(.idx) td.new .ctl{margin-top:8px}
  .bar .btn{flex:1 1 140px}
}
</style>
<style>
.meta{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
h3.sub{font-size:16px;margin-top:6px}
.prod{display:flex;flex-direction:column;gap:22px;scroll-margin-top:16px;padding-top:28px;border-top:3px solid var(--ink)}
.prod__head{display:flex;flex-direction:column;gap:10px}
.prod__head h2{font-size:clamp(28px,4.4vw,40px);font-weight:400}
.status-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.status-row .lbl{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.st-ok.on{background:var(--new-ink);border-color:var(--new-ink);color:var(--surface)}
.chip.st-fix.on{background:var(--high);border-color:var(--high);color:var(--surface)}
.chip.st-no.on{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.chip.st-wait.on{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.tstat{font-size:12.5px;font-weight:500;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.tstat.st-wait{color:var(--muted)} .tstat.st-ok{color:var(--new-ink)} .tstat.st-fix{color:var(--high)} .tstat.st-no{color:var(--crit)}
.psec{background:var(--surface);border:1px solid var(--line);padding:18px 20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px;min-width:0}
.psec__h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.psec__h h3{flex:1 1 200px;min-width:0}
.psec__h .n{font-family:var(--f-mono);font-size:13px;color:var(--accent);background:var(--accent-soft);padding:2px 8px}
.pm-note{display:flex;flex-direction:column;gap:6px;flex-basis:100%}
.pm-note textarea[hidden]{display:none}
.kv{display:grid;gap:0;margin:0;border:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--muted);font-size:14px}
.kv dd{margin:0}
.why-inline{display:block;font-size:13.5px;color:var(--muted);margin-top:4px}
.para{max-width:78ch}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.flag{border-inline-start:3px solid var(--crit);padding-inline-start:12px;display:flex;flex-direction:column;gap:4px}
.flag b,.dont b{font-size:13px;color:var(--crit)}
.flag ul,.dont ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.dont{border-inline-start:3px solid var(--high);padding-inline-start:12px;display:flex;flex-direction:column;gap:4px}
.dont b{color:var(--high)}
.findings{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.findings li{border-bottom:1px solid var(--line);padding-bottom:10px;display:flex;flex-direction:column;gap:4px}
.findings li:last-child{border-bottom:0}
.f-s{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.f-s a{word-break:break-word}
.lv{font-size:11.5px;font-weight:500;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}
.lv-v{color:var(--new-ink)} .lv-s{color:var(--ph)} .lv-n{color:var(--crit)} .lv-i{color:var(--med)} .lv-p{color:var(--accent)}
.verify{border:1px solid var(--line);padding:8px 12px}
.verify summary{cursor:pointer;font-weight:500;font-size:14.5px}
.verify ol{margin:8px 0 0;padding-inline-start:22px;display:grid;gap:4px;font-size:14.5px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.two h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:500}
.copy{display:grid;gap:10px}
.pm-copy{border:1px solid var(--line);background:var(--bg);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pm-copy__lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.pm-copy__text{font-size:16.5px;line-height:1.65}
.pm-copy.edited{box-shadow:inset -3px 0 0 var(--accent)}
.pm-copy.dec-ok{border-color:var(--new-ink)}
.pm-copy.dec-no .pm-copy__text{text-decoration:line-through;opacity:.55}
.pri-h{color:var(--crit);font-weight:500} .pri-m{color:var(--high)} .pri-l{color:var(--muted)}
.notes textarea{min-height:120px}
table.ov td,table.ov th{font-size:14px}
</style>

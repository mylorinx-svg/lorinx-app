<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>LORINX כוס רוח חשמלית 4:5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414;
    --ink-soft:#3a3632;
    --paper:#f6f2ec;
    --red:#C8102E;
    --W:1080px; --H:1350px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ddd}
  .ad{
    position:relative; width:var(--W); height:var(--H); overflow:hidden;
    background:var(--paper); font-family:'Heebo',sans-serif; color:var(--ink);
  }
  /* real store photo, cropped to 4:5 with product centred */
  .hero{
    position:absolute; inset:0;
    background:url('hero.jpg') no-repeat;
    background-size:1249px 1249px;           /* 2048 -> 1249 */
    background-position:-52px 165px;         /* product centred, below headline */
  }
  /* soft light scrim behind the headline only */
  .scrim{
    position:absolute; left:0; right:0; top:0; height:560px;
    background:linear-gradient(to bottom, var(--paper) 0%, var(--paper) 34%, rgba(246,242,236,.7) 62%, rgba(246,242,236,0) 100%);
  }
  .top{position:absolute; top:70px; left:0; right:0; text-align:center; padding:0 70px}
  .brand{
    font-family:'Heebo'; font-weight:500; font-size:22px; letter-spacing:.42em;
    color:var(--ink-soft); direction:ltr; margin-bottom:30px;
  }
  .brand b{color:var(--red); font-weight:800}
  h1{
    font-family:'Frank Ruhl Libre',serif; font-weight:900;
    font-size:104px; line-height:1.02; letter-spacing:-.01em;
  }
  h1 .soft{font-weight:500; color:var(--ink-soft)}
  .sub{
    margin-top:26px; font-size:33px; font-weight:400; line-height:1.4; color:var(--ink-soft);
  }
  .sub b{font-weight:700;color:var(--ink)}

  /* in-use proof: the store's real photo, red light on the neck */
  .proof{
    position:absolute; right:40px; top:560px; width:260px; text-align:center;
  }
  .proof .ring{
    width:230px; height:230px; border-radius:50%; overflow:hidden;
    border:6px solid #fff; box-shadow:0 18px 40px rgba(0,0,0,.22);
    margin:0 auto; background:url('inuse.png') no-repeat; background-size:416px auto; background-position:-99px -134px;
  }
  .proof span{
    display:inline-block; margin-top:14px; font-size:22px; font-weight:500; color:var(--ink); white-space:nowrap;
    background:rgba(255,255,255,.92); padding:6px 16px; border-radius:40px;
  }

  /* offer bar */
  .bar{
    position:absolute; left:0; right:0; bottom:0; height:250px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:space-between; padding:0 70px;
  }
  .offer .k{font-size:24px; font-weight:400; color:#cfc9c2; letter-spacing:.02em}
  .offer .v{font-size:56px; font-weight:800; line-height:1.15; margin-top:4px}
  .offer .v small{font-size:30px; font-weight:500}
  .offer .meta{margin-top:10px; font-size:23px; color:#cfc9c2; font-weight:400}
  .offer .meta i{font-style:normal; color:var(--red); padding:0 10px}
  .cta{
    background:#fff; color:var(--ink); font-weight:800; font-size:32px;
    padding:26px 44px; border-radius:60px; white-space:nowrap;
    display:flex; align-items:center; gap:16px;
  }
  .cta .arr{display:inline-block; width:44px; height:44px; border-radius:50%; background:var(--red); color:#fff;
    font-size:28px; line-height:44px; text-align:center}
</style>
</head>
<body>
<div class="ad" id="ad">
  <div class="hero"></div>
  <div class="scrim"></div>

  <div class="top">
    <div class="brand">LORINX<b>.</b></div>
    <h1>כוסות רוח.<br><span class="soft">בלי אש, בלי תור.</span></h1>
    <p class="sub">ואקום, חום ואור אדום במכשיר אחד אלחוטי.<br><b>15 דקות לאזור</b>, בסלון שלכם.</p>
  </div>

  <div class="proof">
    <div class="ring"></div>
    <span>ככה זה נראה בשימוש</span>
  </div>

  <div class="bar">
    <div class="offer">
      <div class="k">מארז זוגי · 189.95 ₪ ליחידה</div>
      <div class="v">2 ב-379.90 <small>₪</small></div>
      <div class="meta">משלוח חינם<i>·</i>אחריות לשנה<i>·</i>14 יום להחזרה</div>
    </div>
    <div class="cta">להזמנה באתר <span class="arr">←</span></div>
  </div>
</div>
</body>
</html>
